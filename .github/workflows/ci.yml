name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by app.core.config.Settings. CI only needs a syntactically valid
  # browser origin; the tests stub Clerk and override the auth dependency.
  FRONTEND_URL: http://localhost:5173

jobs:
  backend:
    name: Backend lint and SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Optional integration test for the Redis rate-limit store. The service
      # is disposable and never a project/production Redis instance.
      HD_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13.1"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check (pyrefly)
        working-directory: backend
        run: uv run pyrefly check

      - name: pytest (SQLite; PostgreSQL suites skip)
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compile-time values only. The production build intentionally fails if
      # VITE_API_URL is missing, non-HTTPS, or a localhost origin.
      VITE_API_URL: https://api.ci.example.invalid
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use the project's npm version
        run: npm install --global npm@12.2.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13.1"

      - name: Create production-only Python environment
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/helpdesk-prod-venv
        run: uv sync --frozen --no-dev --no-install-project

      - name: Audit Python production dependencies
        working-directory: backend
        run: >-
          uvx pip-audit
          --path "${{ runner.temp }}/helpdesk-prod-venv/lib/python3.13/site-packages"
          --progress-spinner off

  migrations:
    name: Alembic migrations (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: migrate_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d migrate_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://verify:verify@127.0.0.1:5432/migrate_verify
      CLERK_SECRET_KEY: sk_test_dummy
      AUTO_CREATE_TABLES: "false"
      UPLOAD_DIR: /tmp/helpdesk-ci-uploads
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13.1"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Upgrade to head
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Verify current revision
        working-directory: backend
        run: uv run alembic current

      - name: Verify models and migrations agree
        working-directory: backend
        run: uv run alembic check

      - name: Exercise 0009 downgrade and re-upgrade
        working-directory: backend
        run: |
          uv run alembic downgrade 0008_ticket_number_not_null
          uv run alembic upgrade head

  postgres-integration:
    name: PostgreSQL integration tests (disposable service)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: hdverify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d hdverify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test modules refuse anything whose database name does not contain
      # "test", "verify" or "ci". These are throw-away service databases.
      HD_TEST_POSTGRES_URL: postgresql+psycopg://verify:verify@127.0.0.1:5432/hdverify
      HD_DEMO_SEED_POSTGRES_URL: postgresql+psycopg://verify:verify@127.0.0.1:5432/helpdesk_demo_verify
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13.1"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Create the dedicated demo-seed database
        run: >-
          docker exec ${{ job.services.postgres.id }}
          createdb -U verify helpdesk_demo_verify

      - name: E2E support flow (auth -> create -> assignment)
        working-directory: backend
        run: uv run pytest -q tests/test_e2e_support_flow_postgres.py

      - name: PostgreSQL suites
        working-directory: backend
        run: >-
          uv run pytest -q
          tests/test_postgres_integration.py
          tests/test_support_workflows_postgres.py
          tests/test_internal_messages_postgres.py
          tests/test_qa_seed_postgres.py

      - name: Demo seed suite (dedicated empty database)
        working-directory: backend
        run: uv run pytest -q tests/test_demo_seed_postgres.py

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        id: backend_build
        run: docker build -t helpdesk-backend:ci ./backend

      - name: Build frontend image
        id: frontend_build
        run: >-
          docker build
          --build-arg VITE_API_URL=https://api.ci.example.invalid
          --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_ci_placeholder
          --build-arg VITE_ATTACHMENTS_ENABLED=false
          -t helpdesk-frontend:ci ./frontend

      - name: Frontend image serves health and runs as non-root
        run: |
          docker run -d --name helpdesk-web-ci -p 8080:8080 \
            -e API_ORIGIN=https://api.ci.example.invalid helpdesk-frontend:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          # The image is built to run unprivileged; assert it, not just assume it.
          test "$(docker exec helpdesk-web-ci id -u)" = "101"
          docker stop helpdesk-web-ci

      # Image scanning is reported to the Security tab as SARIF. Gating on the
      # result is intentionally opt-in: the base images are pinned by tag, so an
      # unfixed base-image CVE must not fail every PR. Once the baseline is
      # reviewed, change `exit-code` to "1" (and keep `ignore-unfixed: true`).
      #
      # The `version` input is pinned explicitly. The previous pin relied on the
      # action default (v0.65.0), which has no published release assets, so
      # setup-trivy failed before any scan ran and both SARIF files were
      # missing. v0.70.0 is a real, checksum-verified release for Linux-64bit.
      - name: Trivy image scan (backend)
        id: backend_scan
        if: ${{ !cancelled() && steps.backend_build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: helpdesk-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Validate backend SARIF report
        id: backend_sarif
        if: ${{ !cancelled() && steps.backend_scan.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -s trivy-backend.sarif
          jq -e '.version == "2.1.0" and (.runs | type == "array" and length > 0)' \
            trivy-backend.sarif >/dev/null

      - name: Upload backend scan
        if: ${{ !cancelled() && steps.backend_sarif.outcome == 'success' && hashFiles('trivy-backend.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Trivy image scan (frontend)
        id: frontend_scan
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: helpdesk-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Validate frontend SARIF report
        id: frontend_sarif
        if: ${{ !cancelled() && steps.frontend_scan.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -s trivy-frontend.sarif
          jq -e '.version == "2.1.0" and (.runs | type == "array" and length > 0)' \
            trivy-frontend.sarif >/dev/null

      - name: Upload frontend scan
        if: ${{ !cancelled() && steps.frontend_sarif.outcome == 'success' && hashFiles('trivy-frontend.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint helm/helpdesk --set backend.existingSecret=helpdesk-secrets

      - name: Render chart (default and ingress variants)
        run: |
          helm template helpdesk helm/helpdesk \
            --set backend.existingSecret=helpdesk-secrets >/dev/null
          helm template helpdesk helm/helpdesk \
            --set backend.existingSecret=helpdesk-secrets \
            --set ingress.enabled=true \
            --set 'ingress.apiHosts[0].host=api.helpdesk.example.com' >/dev/null

  security:
    name: Static security analysis and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # No job needs push credentials; don't leave the checkout token in git
      # config where an install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python, javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
