apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helpdesk.fullname" . }}-config
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.frontend.config }}
  FRONTEND_{{ $key }}: {{ $value | quote }}
  {{- end }}
