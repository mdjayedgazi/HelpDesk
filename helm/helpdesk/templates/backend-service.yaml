apiVersion: v1
kind: Service
metadata:
  name: {{ include "helpdesk.fullname" . }}-backend
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backendService.type }}
  ports:
    - port: {{ .Values.backendService.port }}
      targetPort: {{ .Values.backendService.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "helpdesk.backendSelectorLabels" . | nindent 4 }}
