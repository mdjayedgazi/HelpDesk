[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16",
    "clerk-backend-api>=7.0.0",
    "fastapi[standard]==0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings==2.16.0",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]==2.1.5",
    "sqlmodel>=0.0.47",
]

[dependency-groups]
dev = [
    "pyrefly==1.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
