[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic==1.20.1",
    "clerk-backend-api>=7.0.0",
    "fastapi[standard]==0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings==2.16.1",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=6.0",
    "sqlalchemy[asyncio]==2.1.6",
    "sqlmodel>=0.0.47",
]

[dependency-groups]
dev = [
    "pyrefly==1.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Measure the application package; omit tests, migrations scaffolding and the
# process entrypoints that only wire up the app. Branch coverage is on so an
# untaken error path is visible, not just an unexecuted line.
source = ["app"]
branch = true
omit = [
    "app/main.py",
    "*/__init__.py",
    # The two bulk operator seed-fixture scripts (1000+ literal demo rows) are
    # exercised by the dedicated PostgreSQL seed suites
    # (tests/test_demo_seed_postgres.py, tests/test_qa_seed_postgres.py) in the
    # CI `postgres-integration` job, not by the fast SQLite job whose coverage
    # this gate measures. Keeping them out of *this* denominator avoids a
    # misleading drop; they remain fully covered where they actually run.
    "app/commands/seed_demo_data.py",
    "app/commands/seed_qa_data.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# Regression gate, not an aspiration. The measured baseline is ~75.8% combined
# (line ~80%, branch ~58%) on the SQLite job. The floor is set a little below
# that so ordinary churn does not break CI, while a real coverage regression
# (e.g. a new untested router or service) fails the job. Raise deliberately
# after adding meaningful tests; never lower it to make a red build green.
fail_under = 75

[tool.coverage.paths]
source = ["app"]

[tool.ruff]
# Explicit project policy (Ruff 0.17 changed its isolated defaults, so the gate
# must not depend on tool defaults). Python 3.13 matches `.python-version`.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# High-signal correctness/import rules plus the specific families reviewed in
# the audit: bugbear, blind exceptions, comprehension/string-concat
# modernization, legacy naming, Ruff-native checks, simplification, and the
# invalid-type exception rule.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "C4",
    "ISC",
    "N999",
    "RUF",
    "SIM",
    "TRY004",
]
# ``str, Enum`` is retained for the SQLModel/PostgreSQL enum columns; migrating
# every enum to ``StrEnum`` is a separate compatibility change, not a lint fix.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# The large, deterministic seed scripts intentionally use literal-heavy
# ``dict(...)`` fixture blocks and adjacent string literals. Exempt only those
# two stylistic rules; every other enabled rule still applies.
"app/commands/seed_*.py" = ["C408", "ISC004"]
# Legacy camelCase module names are part of the existing import surface. Renaming
# them would touch many modules/migrations for no behavioral gain.
"app/models/ticketHistory.py" = ["N999"]
"app/schemas/ticketHistorys.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
