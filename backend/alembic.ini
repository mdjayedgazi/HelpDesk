# Alembic configuration for the HelpDesk backend.
#
# The database URL is intentionally NOT set here. It is read from the
# application settings (DATABASE_URL, via pydantic-settings) inside
# `migrations/env.py`, so the CLI and the app can never drift apart.

[alembic]
script_location = migrations

# Make `app` importable when alembic runs from the backend directory.
prepend_sys_path = .

# Keep generated revision filenames readable and sorted by time.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# URL is provided by migrations/env.py.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
