<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/deepseek_svg_20261019_8f1ee9.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="HelpDesk brings tickets, team collaboration and customer conversations into one organised support workspace."
    />
    <title>HelpDesk · Support, without the chaos</title>
    <script>
      // Apply the persisted theme before the bundle loads to avoid a flash of
      // the wrong theme. Must stay in sync with src/theme/colorMode.tsx.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('helpdesk-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* Storage or matchMedia unavailable — fall back to the light theme. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
